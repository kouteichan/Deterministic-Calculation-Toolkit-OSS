[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-calculation-toolkit"
version = "0.2.0"
description = "Deterministic decimal, comparison, conversion, statistics, and combinatorics utilities for AI and automated workflows."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "kouteichan" }]
keywords = ["decimal", "calculation", "deterministic", "rounding", "statistics", "combinatorics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/kouteichan/Deterministic-Calculation-Toolkit-OSS"

[project.optional-dependencies]
test = ["pytest>=7.4"]

[project.scripts]
dct-calc = "deterministic_calculation_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers"]
